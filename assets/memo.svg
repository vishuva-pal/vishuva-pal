<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Interoffice memorandum from V. Palanivelu, Data Platform and ERP, regarding availability for internship and co-op opportunities">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F6ECD4"/>
      <stop offset="0.55" stop-color="#EFE2C4"/>
      <stop offset="1" stop-color="#E4D5B2"/>
    </linearGradient>
    <filter id="pdrop" x="-12%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="pclip"><rect x="60" y="26" width="780" height="548" rx="3"/></clipPath>
  </defs>

  <rect width="900" height="600" fill="#140F0A"/>

  <!-- sheet -->
  <g filter="url(#pdrop)">
    <rect x="60" y="26" width="780" height="548" rx="3" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#pclip)">
    <!-- coffee ring -->
    <g transform="translate(716,486)" fill="none" stroke="#8A5A22" opacity="0.30">
      <circle r="46" stroke-width="7"/>
      <circle r="39" stroke-width="1.5" opacity="0.6"/>
    </g>
    <!-- received stamp -->
    <g transform="translate(648,196) rotate(-14)" opacity="0.42">
      <rect x="-96" y="-34" width="192" height="68" rx="5" fill="none" stroke="#9E2B25" stroke-width="4"/>
      <rect x="-88" y="-26" width="176" height="52" rx="3" fill="none" stroke="#9E2B25" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle" font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="25" font-weight="bold" fill="#9E2B25" letter-spacing="3">RECEIVED</text>
      <text x="0" y="19" text-anchor="middle" font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="12" fill="#9E2B25" letter-spacing="2">DEPT. 4407 -- FILE COPY</text>
    </g>
  </g>
  <rect x="60" y="26" width="780" height="548" rx="3" fill="none" stroke="#B9A87F" stroke-width="1.5"/>

  <!-- letterhead -->
  <rect x="60" y="26" width="780" height="62" fill="#2B2018"/>
  <text x="90" y="66" font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="23" fill="#FFB000" letter-spacing="6">INTEROFFICE MEMORANDUM</text>
  <text x="700" y="66" text-anchor="end" font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="12" fill="#C77E00" letter-spacing="2">FORM 4407-A</text>
  <rect x="60" y="88" width="780" height="4" fill="#C77E00"/>

  <!-- punch holes -->
  <g fill="#140F0A" opacity="0.85">
    <circle cx="84" cy="190" r="7"/>
    <circle cx="84" cy="300" r="7"/>
    <circle cx="84" cy="410" r="7"/>
  </g>

  <g font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="15" fill="#3A2E20">
    <!-- header fields -->
    <g font-size="14">
      <text x="118" y="132" fill="#6B563A" letter-spacing="2">TO</text>
      <text x="205" y="132">Hiring Managers, Recruiters, Fellow Engineers</text>
      <text x="118" y="158" fill="#6B563A" letter-spacing="2">FROM</text>
      <text x="205" y="158">V. Palanivelu, Data Platform / ERP</text>
      <text x="118" y="184" fill="#6B563A" letter-spacing="2">DATE</text>
      <text x="205" y="184">Revised continuously. Discard previous editions.</text>
      <text x="118" y="210" fill="#6B563A" letter-spacing="2">RE</text>
      <text x="205" y="210">Availability -- Internship &amp; Co-op Opportunities</text>
      <text x="118" y="236" fill="#6B563A" letter-spacing="2">CC</text>
      <text x="205" y="236">/dev/null</text>
    </g>
    <g stroke="#B9A87F" stroke-width="1">
      <line x1="118" y1="142" x2="782" y2="142"/>
      <line x1="118" y1="168" x2="782" y2="168"/>
      <line x1="118" y1="194" x2="782" y2="194"/>
      <line x1="118" y1="220" x2="782" y2="220"/>
      <line x1="118" y1="246" x2="782" y2="246"/>
    </g>

    <!-- body -->
    <text x="118" y="298">Software Engineer, 3+ years building data reporting, analysis</text>
    <text x="118" y="322">and scalable pipelines. Currently an IT graduate student at the</text>
    <text x="118" y="346">University of Massachusetts Boston -- wicked smaat, it is.</text>

    <text x="118" y="394">Interests: ERP architecture, supply chain analytics, warehouse</text>
    <text x="118" y="418">modeling, and pointing machine learning at problems that used</text>
    <text x="118" y="442">to require a very long spreadsheet.</text>

    <text x="118" y="490">Please route all inquiries through the Suggestion Box below.</text>
  </g>

  <!-- signature -->
  <path d="M120 536 c26 -20 40 6 58 -8 c18 -14 26 12 48 -4 c16 -12 30 8 46 -6"
        fill="none" stroke="#2B3A6B" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="118" y1="550" x2="330" y2="550" stroke="#6B563A" stroke-width="1"/>
  <text x="118" y="566" font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="11" fill="#6B563A" letter-spacing="1">V. PALANIVELU / DATA PLATFORM</text>

  <!-- paperclip -->
  <path d="M742 18 c22 0 22 34 0 34 c-22 0 -22 -46 4 -46 c26 0 26 58 -2 58 c-20 0 -24 -18 -24 -30"
        fill="none" stroke="#9AA3AD" stroke-width="4.5" stroke-linecap="round"/>
</svg>
