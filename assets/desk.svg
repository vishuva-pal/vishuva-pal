<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Retro office desk scene with an amber CRT monitor, keyboard, desk lamp, coffee mug, telephone, wall clock and a potted plant">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241C13"/>
      <stop offset="1" stop-color="#191309"/>
    </linearGradient>
    <linearGradient id="desktop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B563A"/>
      <stop offset="0.25" stop-color="#4A3B28"/>
      <stop offset="1" stop-color="#2B2018"/>
    </linearGradient>
    <linearGradient id="lampcone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="scrglow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#FFB000" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sl" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.4" fill="#000" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1000" height="430" fill="url(#wall)"/>

  <!-- wall clock -->
  <g transform="translate(126,86)">
    <circle r="44" fill="#2B2018" stroke="#6B563A" stroke-width="4"/>
    <circle r="36" fill="#E8D9B5"/>
    <g stroke="#3A2E20" stroke-width="2.5" stroke-linecap="round">
      <line y1="-28" y2="-22"/><line x1="28" x2="22"/><line y1="28" y2="22"/><line x1="-28" x2="-22"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-19" stroke="#2B2018" stroke-width="3.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="60s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="15" y2="9" stroke="#2B2018" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="0" y2="-26" stroke="#9E2B25" stroke-width="1.4">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#2B2018"/>
  </g>

  <!-- framed certificate -->
  <g transform="translate(806,58)">
    <rect x="-70" y="-34" width="140" height="94" rx="3" fill="#3A2E20" stroke="#6B563A" stroke-width="3"/>
    <rect x="-60" y="-24" width="120" height="74" fill="#E8D9B5"/>
    <g font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" fill="#4A3315" text-anchor="middle">
      <text y="-4" font-size="9" letter-spacing="1">EMPLOYEE OF</text>
      <text y="8" font-size="9" letter-spacing="1">THE MONTH</text>
      <text y="30" font-size="13" fill="#9E2B25" letter-spacing="1">V. PALANIVELU</text>
    </g>
    <g stroke="#C9A461" stroke-width="1" fill="none"><rect x="-54" y="-18" width="108" height="62"/></g>
  </g>

  <!-- lamp light cone -->
  <path d="M760 148 L900 148 L968 300 L700 300 Z" fill="url(#lampcone)"/>

  <!-- desk -->
  <rect x="0" y="300" width="1000" height="20" fill="#8A7A5E"/>
  <rect x="0" y="316" width="1000" height="94" fill="url(#desktop)"/>
  <rect x="60" y="410" width="26" height="20" fill="#211A11"/>
  <rect x="914" y="410" width="26" height="20" fill="#211A11"/>

  <!-- CRT on desk -->
  <g transform="translate(300,116)">
    <path d="M96 168 h68 l10 16 h-88 z" fill="#3A2E20"/>
    <rect x="60" y="184" width="140" height="10" rx="5" fill="#4A3B28"/>
    <rect x="0" y="0" width="260" height="172" rx="16" fill="#4A3B28" stroke="#6B563A" stroke-width="2"/>
    <rect x="16" y="14" width="228" height="126" rx="8" fill="#0E0A06"/>
    <rect x="16" y="14" width="228" height="126" rx="8" fill="url(#scrglow)"/>
    <g font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="10" fill="#FFB000">
      <text x="28" y="36">C:\&gt; SELECT * FROM career;</text>
      <text x="28" y="52" fill="#C77E00">17 rows returned.</text>
      <text x="28" y="76">C:\&gt; RUN pipeline.sh</text>
      <text x="28" y="92" fill="#E8D9B5">[####################] 100%</text>
      <text x="28" y="116">C:\&gt;</text>
      <rect x="60" y="107" width="7" height="11" fill="#FFB000">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="16" y="14" width="228" height="126" rx="8" fill="url(#sl)"/>
    <circle cx="236" cy="158" r="3.4" fill="#FFB000">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- keyboard -->
  <g transform="translate(292,330)">
    <path d="M0 8 L276 8 L288 44 L-12 44 Z" fill="#3A2E20" stroke="#6B563A" stroke-width="1.5"/>
    <g fill="#57462F">
      <rect x="6" y="14" width="258" height="6" rx="2"/>
      <rect x="2" y="24" width="266" height="6" rx="2"/>
      <rect x="-2" y="34" width="274" height="6" rx="2"/>
    </g>
  </g>
  <!-- mouse -->
  <g transform="translate(614,344)">
    <rect x="0" y="0" width="30" height="42" rx="14" fill="#3A2E20" stroke="#6B563A" stroke-width="1.5"/>
    <line x1="15" y1="4" x2="15" y2="16" stroke="#6B563A" stroke-width="1.5"/>
    <path d="M15 0 c0 -16 -30 -12 -30 -26" fill="none" stroke="#6B563A" stroke-width="2"/>
  </g>

  <!-- desk lamp -->
  <g transform="translate(848,150)">
    <rect x="-40" y="146" width="80" height="10" rx="5" fill="#3A2E20"/>
    <line x1="0" y1="146" x2="-14" y2="52" stroke="#57462F" stroke-width="7" stroke-linecap="round"/>
    <line x1="-14" y1="52" x2="34" y2="14" stroke="#57462F" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 -10 L64 22 L26 44 Z" fill="#4A3B28" stroke="#6B563A" stroke-width="2"/>
    <circle cx="40" cy="30" r="7" fill="#FFB000">
      <animate attributeName="opacity" values="1;0.82;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- coffee mug -->
  <g transform="translate(690,336)">
    <path d="M0 0 h44 v34 a22 12 0 0 1 -44 0 z" fill="#E8D9B5" stroke="#B9A87F" stroke-width="1.5"/>
    <ellipse cx="22" cy="0" rx="22" ry="7" fill="#4A2B12"/>
    <path d="M44 6 a13 13 0 0 1 0 20" fill="none" stroke="#B9A87F" stroke-width="4.5"/>
    <g stroke="#8A7A5E" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M12 -10 q5 -9 0 -17 q-5 -9 0 -15">
        <animate attributeName="opacity" values="0;0.65;0" dur="3.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M30 -10 q-5 -9 0 -17 q5 -9 0 -15">
        <animate attributeName="opacity" values="0;0.65;0" begin="1.4s" dur="3.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12" begin="1.4s" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- rotary telephone -->
  <g transform="translate(96,326)">
    <rect x="0" y="24" width="96" height="34" rx="8" fill="#2B2018" stroke="#6B563A" stroke-width="1.5"/>
    <circle cx="48" cy="41" r="13" fill="#3A2E20" stroke="#8A7A5E" stroke-width="2"/>
    <g fill="#8A7A5E">
      <circle cx="48" cy="31" r="1.8"/><circle cx="56" cy="34" r="1.8"/><circle cx="58" cy="43" r="1.8"/>
      <circle cx="52" cy="50" r="1.8"/><circle cx="42" cy="50" r="1.8"/><circle cx="38" cy="42" r="1.8"/><circle cx="40" cy="34" r="1.8"/>
    </g>
    <rect x="-6" y="8" width="108" height="18" rx="9" fill="#3A2E20" stroke="#6B563A" stroke-width="1.5"/>
    <path d="M102 34 q28 10 10 24 q-18 14 4 22" fill="none" stroke="#57462F" stroke-width="3.5"/>
  </g>

  <!-- paper stack + pen -->
  <g transform="translate(214,352)">
    <rect x="0" y="6" width="62" height="26" rx="2" fill="#D9C79E" stroke="#B9A87F" stroke-width="1"/>
    <rect x="3" y="2" width="62" height="26" rx="2" fill="#E8D9B5" stroke="#B9A87F" stroke-width="1"/>
    <g stroke="#B9A87F" stroke-width="1.2">
      <line x1="10" y1="10" x2="58" y2="10"/><line x1="10" y1="16" x2="58" y2="16"/><line x1="10" y1="22" x2="44" y2="22"/>
    </g>
    <line x1="-4" y1="34" x2="34" y2="26" stroke="#9E2B25" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- potted plant -->
  <g transform="translate(942,286)">
    <g fill="none" stroke="#4A6B3A" stroke-width="5" stroke-linecap="round">
      <path d="M0 0 q-22 -26 -8 -52"><animate attributeName="stroke" values="#4A6B3A;#5A7D46;#4A6B3A" dur="7s" repeatCount="indefinite"/></path>
      <path d="M0 0 q22 -22 12 -48"/>
      <path d="M0 0 q-4 -30 4 -44"/>
    </g>
    <path d="M-24 0 h48 l-7 34 h-34 z" fill="#8A4A2B" stroke="#6B3A22" stroke-width="1.5"/>
    <rect x="-27" y="-5" width="54" height="9" rx="3" fill="#9E5A33"/>
  </g>
</svg>
