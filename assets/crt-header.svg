<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Amber CRT terminal booting a personnel file for Vishuva Palanivelu, Dept 4407, Data Platform and ERP">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57462F"/>
      <stop offset="0.42" stop-color="#3A2E20"/>
      <stop offset="1" stop-color="#211A11"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#211A11"/>
      <stop offset="0.5" stop-color="#4A3B28"/>
      <stop offset="1" stop-color="#211A11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0" stop-color="#FFB000" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFB000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.30"/>
    </pattern>
    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="scr"><rect x="62" y="34" width="876" height="202" rx="16"/></clipPath>
  </defs>

  <rect width="1000" height="320" fill="#140F0A"/>

  <!-- monitor stand -->
  <path d="M446 252 h108 l14 34 h-136 z" fill="url(#stand)"/>
  <rect x="380" y="286" width="240" height="16" rx="8" fill="#3A2E20"/>
  <rect x="380" y="286" width="240" height="5" rx="2.5" fill="#57462F"/>

  <!-- bezel -->
  <g filter="url(#drop)">
    <rect x="30" y="8" width="940" height="248" rx="28" fill="url(#bezel)"/>
  </g>
  <rect x="30" y="8" width="940" height="248" rx="28" fill="none" stroke="#6B563A" stroke-width="2"/>
  <rect x="34" y="12" width="932" height="6" rx="3" fill="#6B563A" opacity="0.45"/>

  <!-- screen -->
  <rect x="62" y="34" width="876" height="202" rx="16" fill="#0E0A06"/>
  <g clip-path="url(#scr)">
    <rect x="62" y="34" width="876" height="202" fill="url(#glow)"/>

    <g font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="18" fill="#FFB000" filter="url(#bloom)">
      <text x="92" y="70">SYSTEM 4407 BIOS v2.14 -- 640K OK
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.04;0.052" begin="0s" dur="4s" fill="freeze"/>
      </text>
      <text x="92" y="98" fill="#C77E00">Loading DEPT.SYS ..................... [ OK ]
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.19;0.202" begin="0s" dur="4s" fill="freeze"/>
      </text>
      <text x="92" y="126">C:\&gt; LOGIN VISHUVAP
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.34;0.352" begin="0s" dur="4s" fill="freeze"/>
      </text>
      <text x="92" y="154" fill="#E8D9B5">AUTHENTICATED. GOOD MORNING, VISITOR.
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.49;0.502" begin="0s" dur="4s" fill="freeze"/>
      </text>
      <text x="92" y="182">C:\&gt; OPEN PERSONNEL_FILE /V.PALANIVELU
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.64;0.652" begin="0s" dur="4s" fill="freeze"/>
      </text>
      <text x="92" y="210" fill="#C77E00">DATA PLATFORM | ERP ARCHITECTURE | DEPT. 4407
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.79;0.802" begin="0s" dur="4s" fill="freeze"/>
      </text>
      <rect x="586" y="196" width="11" height="19" fill="#FFB000">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="3.6s" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="62" y="18" width="876" height="236" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4" dur="0.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="62" y="34" width="876" height="202" fill="url(#vig)"/>
    <!-- rolling refresh band -->
    <rect x="62" y="34" width="876" height="26" fill="#FFB000" opacity="0.045">
      <animateTransform attributeName="transform" type="translate" values="0 -40;0 220" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="62" y="34" width="876" height="202" rx="16" fill="none" stroke="#120D08" stroke-width="6"/>

  <!-- power lamp + model plate -->
  <circle cx="906" cy="246" r="5" fill="#FFB000">
    <animate attributeName="opacity" values="1;0.45;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="906" cy="246" r="9" fill="#FFB000" opacity="0.18"/>
  <g font-family="ui-monospace,'DejaVu Sans Mono','Courier New',Courier,monospace" font-size="11" fill="#8A7A5E" letter-spacing="2">
    <text x="66" y="250">MODEL 4407-A</text>
    <text x="762" y="250" text-anchor="end">AMBER PHOSPHOR</text>
  </g>
</svg>
